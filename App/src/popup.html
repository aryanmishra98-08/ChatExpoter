<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Usage</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --primary: #6366f1;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --yellow: #eab308;
      --bg: #1a1a1a;
      --bg-secondary: #262626;
      --bg-tertiary: #333333;
      --border: #404040;
      --text: #fafafa;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --bg-secondary: #f4f4f5;
        --bg-tertiary: #e4e4e7;
        --border: #d4d4d8;
        --text: #18181b;
        --text-secondary: #52525b;
        --text-muted: #a1a1aa;
      }
    }

    body {
      width: 280px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
    }

    .container { padding: 14px; }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 32px;
      height: 32px;
      background: var(--primary);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo svg { width: 18px; height: 18px; color: white; }

    .header-title { font-size: 14px; font-weight: 600; }
    .header-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

    /* Usage cards */
    .usage-section { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }

    .usage-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
    }

    .card-label { font-size: 12px; font-weight: 500; color: var(--text); }
    .card-pct { font-size: 13px; font-weight: 700; }

    .card-bar {
      height: 5px;
      background: var(--bg-tertiary);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 5px;
    }

    .card-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease, background-color 0.3s ease;
    }

    .card-reset { font-size: 10px; color: var(--text-muted); }

    /* No data state */
    .no-data {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      padding: 16px 0;
    }

    /* Button */
    .btn-open {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      padding: 9px 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-open:hover { background: #4f46e5; }
    .btn-open svg { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 20V10"/>
          <path d="M18 20V4"/>
          <path d="M6 20v-4"/>
        </svg>
      </div>
      <div>
        <div class="header-title">Claude Usage</div>
        <div class="header-sub">Real-time limit tracking</div>
      </div>
    </div>

    <div class="usage-section" id="usage-section">
      <!-- 5-Hour Session -->
      <div class="usage-card" id="session-card">
        <div class="card-header">
          <span class="card-label">5-Hour Session</span>
          <span class="card-pct" id="session-pct">—</span>
        </div>
        <div class="card-bar">
          <div class="card-fill" id="session-fill" style="width: 0%;"></div>
        </div>
        <div class="card-reset" id="session-reset"></div>
      </div>

      <!-- Weekly Limit -->
      <div class="usage-card" id="weekly-card">
        <div class="card-header">
          <span class="card-label">Weekly Limit</span>
          <span class="card-pct" id="weekly-pct">—</span>
        </div>
        <div class="card-bar">
          <div class="card-fill" id="weekly-fill" style="width: 0%;"></div>
        </div>
        <div class="card-reset" id="weekly-reset"></div>
      </div>
    </div>

    <button class="btn-open" id="btn-open-claude">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
        <polyline points="15 3 21 3 21 9"/>
        <line x1="10" y1="14" x2="21" y2="3"/>
      </svg>
      Open Claude.ai
    </button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
